<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения, Любимый!</title>
    <style>
        /* Градиентный небесно-голубой фон */
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Красивая карточка со стеклянным эффектом */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        h1 {
            color: #00695c;
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .photo-container {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 4px solid white;
        }

        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Объемная 3D кнопка */
        button {
            background: linear-gradient(to bottom, #4dd0e1, #00bcd4);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #00838f, 0 10px 20px rgba(0, 188, 212, 0.4);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: linear-gradient(to bottom, #26c6da, #00acc1);
            box-shadow: 0 6px 0 #00838f, 0 15px 25px rgba(0, 188, 212, 0.5);
        }

        /* Эффект нажатия */
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #00838f, 0 5px 10px rgba(0, 188, 212, 0.4);
        }

        #congrats-text {
            display: none;
            color: #d81b60;
            font-size: 32px;
            font-weight: 800;
            margin-top: 25px;
            text-shadow: 2px 2px 0px white;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Стили для стикеров */
        .sticker {
            position: absolute;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
            user-select: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Добавили больше стикеров и разные размеры */
        .s1 { top: 5%; left: 10%; animation-delay: 0s; font-size: 45px; }
        .s2 { top: 15%; right: 10%; animation-delay: 0.8s; font-size: 55px; }
        .s3 { bottom: 15%; left: 8%; animation-delay: 1.5s; font-size: 40px; }
        .s4 { bottom: 8%; right: 12%; animation-delay: 0.3s; font-size: 50px; }
        .s5 { top: 45%; left: 3%; animation-delay: 2s; font-size: 35px; }
        .s6 { top: 55%; right: 4%; animation-delay: 1.2s; font-size: 45px; }
        .s7 { top: 3%; left: 45%; animation-delay: 2.5s; font-size: 30px; }
        .s8 { bottom: 3%; left: 40%; animation-delay: 1.8s; font-size: 40px; }
        .s9 { top: 25%; left: 25%; animation-delay: 0.5s; font-size: 25px; }
        .s10 { bottom: 35%; right: 25%; animation-delay: 3s; font-size: 30px; }
        .s11 { top: 70%; left: 20%; animation-delay: 1s; font-size: 35px; }
        .s12 { top: 80%; right: 30%; animation-delay: 2.2s; font-size: 25px; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Стили для конфетти (салют) */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Много фоновых стикеров -->
    <div class="sticker s1">🐱</div>
    <div class="sticker s2">🎂</div>
    <div class="sticker s3">🍰</div>
    <div class="sticker s4">😺</div>
    <div class="sticker s5">🧁</div>
    <div class="sticker s6">😸</div>
    <div class="sticker s7">🎉</div>
    <div class="sticker s8">🎈</div>
    <div class="sticker s9">🎁</div>
    <div class="sticker s10">🐾</div>
    <div class="sticker s11">🍭</div>
    <div class="sticker s12">❤️</div>

    <!-- Основная карточка -->
    <div class="card">
        <h1>С Днём Рождения, любимый! ❤️</h1>
        
        <div class="photo-container">
            <!-- Убедитесь, что фото называется photo.jpg -->
            <img src="photo.jpg" alt="Наше фото">
        </div>

        <button id="btn" onclick="showCongrats()">Получить поздравление</button>
        
        <div id="congrats-text">Вы поздравлены!</div>
    </div>

    <script>
        function showCongrats() {
            var btn = document.getElementById('btn');
            btn.style.display = 'none';
            
            var text = document.getElementById('congrats-text');
            text.style.display = 'block';

            // Запускаем двойной салют
            fireConfetti();
            fireEmojiFountain();
        }

        // 1. Салют из цветных падающих квадратиков (конфетти)
        function fireConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500'];
            for (let i = 0; i < 100; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 6 + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                let duration = Math.random() * 2 + 1.5;
                let drift = (Math.random() - 0.5) * 200;

                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${drift}px, 100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        // 2. Фонтан из эмодзи, летящих вверх
        function fireEmojiFountain() {
            const emojis = ['🎉', '🥳', '🎈', '🎂', '❤️', '✨', '⭐', '🎁'];
            for (let i = 0; i < 30; i++) {
                let el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'absolute';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '100vh';
                el.style.fontSize = (Math.random() * 25 + 20) + 'px';
                el.style.zIndex = 100;
                el.style.pointerEvents = 'none';
                document.body.appendChild(el);

                let drift = (Math.random() - 0.5) * 300;
                
                el.animate([
                    { transform: `translate(0, 0) scale(0.5) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${drift}px, -110vh) scale(1.5) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 1500,
                    easing: 'ease-out'
                });

                setTimeout(() => el.remove(), 3500);
            }
        }
    </script>
</body>
</html>
